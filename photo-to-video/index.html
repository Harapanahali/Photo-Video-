<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo to Video</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Photo to Video</h1>
  <p>Turn photos into an animated video with camera motion, filters and music. Everything runs in your browser.</p>
</header>

<div class="layout">
<aside class="panel">
  <h2>1. Photos</h2>
  <label class="drop" id="drop" for="files">
    <input type="file" id="files" accept="image/*" multiple>
    <span>Drop photos here or click to choose</span>
  </label>
  <div class="row"><button id="sample">Use a sample photo</button></div>
  <ul id="list" class="list"></ul>

  <h2>2. Motion</h2>
  <label for="motion">Camera motion</label>
  <select id="motion"></select>
  <label for="k">Intensity <b id="kVal">1.0</b></label>
  <input type="range" id="k" min="0.5" max="2" step="0.1" value="1">
  <label for="seg">Seconds per photo <b id="segVal">4</b></label>
  <input type="range" id="seg" min="2" max="10" step="1" value="4">
  <label for="xf">Crossfade between photos <b id="xfVal">0.6</b>s</label>
  <input type="range" id="xf" min="0" max="1.5" step="0.1" value="0.6">

  <h2>3. Look</h2>
  <div class="grid2">
    <label>Size
      <select id="ratio"><option value="16:9">Landscape 16:9</option><option value="9:16">Reel 9:16</option><option value="1:1">Square 1:1</option></select>
    </label>
    <label>Filter
      <select id="filter"><option value="none">None</option><option value="warm">Warm</option><option value="cool">Cool</option><option value="bw">Black and white</option><option value="vivid">Vivid</option><option value="vintage">Vintage</option></select>
    </label>
  </div>
  <label class="chk"><input type="checkbox" id="vig" checked> Soft vignette</label>
  <label class="chk"><input type="checkbox" id="fade" checked> Fade in and out</label>
  <label for="caption">Caption (optional)</label>
  <input type="text" id="caption" maxlength="80" placeholder="e.g. Summer in Bengaluru">
  <label for="music">Music (optional)</label>
  <input type="file" id="music" accept="audio/*">
</aside>

<main>
  <section class="stage">
    <div class="screen"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div class="ctrl">
      <button id="play" disabled>Play</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Timeline" disabled>
      <span id="time">0:00 / 0:00</span>
    </div>
  </section>
  <section class="box">
    <h2>Export</h2>
    <div class="row">
      <label for="fps" style="margin:0">Frame rate</label>
      <select id="fps"><option>24</option><option selected>30</option><option>60</option></select>
      <button id="rec" class="primary" disabled>Record video</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <p class="msg" id="msg">Add at least one photo to begin.</p>
    <div id="result"></div>
  </section>
</main>
</div>

<script src="js/motions.js"></script>
<script src="js/render.js"></script>
<script src="js/recorder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
